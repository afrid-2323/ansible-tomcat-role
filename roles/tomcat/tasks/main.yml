---
- name: Install Java and required packages
  ansible.builtin.dnf:
    name:
      - java-21-openjdk
      - wget
      - tar
    state: present

- name: Create Tomcat user
  ansible.builtin.user:
    name: "{{ tomcat_user }}"
    shell: /bin/false
    create_home: false

- name: Create Tomcat directory
  ansible.builtin.file:
    path: "{{ tomcat_install_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'

- name: Download Tomcat
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: /tmp/tomcat.tar.gz
    mode: '0644'

- name: Extract Tomcat
  ansible.builtin.unarchive:
    src: /tmp/tomcat.tar.gz
    dest: "{{ tomcat_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"

- name: Change Tomcat port
  ansible.builtin.replace:
    path: "{{ tomcat_install_dir }}/conf/server.xml"
    regexp: '(<Connector port=")8080(")'
    replace: '\g<1>{{ tomcat_port }}\g<2>'
  notify: Restart Tomcat

- name: Set Tomcat permissions
  ansible.builtin.file:
    path: "{{ tomcat_install_dir }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    recurse: true

- name: Install Tomcat systemd service
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    mode: '0644'
  notify: Restart Tomcat

- name: Enable and start Tomcat
  ansible.builtin.systemd:
    name: tomcat
    enabled: true
    state: started
    daemon_reload: true
